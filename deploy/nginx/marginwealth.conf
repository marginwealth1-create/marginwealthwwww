# ─────────────────────────────────────────────────────────────────────
#  MarginWealth — production nginx config
#  Live at /etc/nginx/sites-available/marginwealth on the origin host.
#  scripts/deploy.sh syncs this file when it changes between commits.
#
#  TLS: /etc/ssl/marginwealth/origin.{crt,key} are SYMLINKS on the server —
#  to the Let's Encrypt cert (/etc/letsencrypt/live/marginwealth.live/*),
#  issued by certbot over the webroot below and auto-renewed. Before the
#  first cert exists they point at a self-signed pair so nginx can start.
#  Works the same with Cloudflare in front on Full / Full (strict) — NOT
#  on Flexible (that would loop on the :80 → :443 redirect).
# ─────────────────────────────────────────────────────────────────────

# Connection upgrade map — "upgrade" only when client requests WebSocket,
# else "close". Without this, normal HTTP requests (CORS preflight OPTIONS)
# hang because nginx sends Connection: upgrade to backend, confusing uvicorn.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── :80 → ACME challenges, everything else redirects to HTTPS ──────────
server {
    listen 80;
    listen [::]:80;
    server_name marginwealth.live www.marginwealth.live admin.marginwealth.live api.marginwealth.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── marginwealth.live / www → user Next.js (3000) ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/marginwealth/origin.crt;
    ssl_certificate_key /etc/ssl/marginwealth/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name marginwealth.live www.marginwealth.live;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare terminates TLS; Next.js / FastAPI must believe the
        # client used HTTPS so generated URLs / cookies use the https
        # scheme. Without this `req.url` reads http:// and Set-Cookie
        # Secure-only cookies get rejected by the browser.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ── admin.marginwealth.live → admin Next.js (3001) ───────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/marginwealth/origin.crt;
    ssl_certificate_key /etc/ssl/marginwealth/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name admin.marginwealth.live;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

# ── api.marginwealth.live → FastAPI (8000) + WebSocket ───────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/ssl/marginwealth/origin.crt;
    ssl_certificate_key /etc/ssl/marginwealth/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name api.marginwealth.live;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
